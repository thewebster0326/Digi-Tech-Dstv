<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digitech DSTV — Coming Soon</title>
<meta name="description" content="Digitech DSTV's new website is on its way. Professional DSTV installations and digital solutions." />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="signal-field" aria-hidden="true">
    <span class="ring ring-1"></span>
    <span class="ring ring-2"></span>
    <span class="ring ring-3"></span>
  </div>

  <main class="wrap">
    <div class="logo-plate">
      <img class="logo" src="assets/logo.png" alt="Digitech DSTV logo" />
    </div>

    <p class="eyebrow">digitechdstv.co.za</p>
    <h1>We're tuning things in.</h1>
    <p class="lede">
      Our new site is under construction. Digitech DSTV delivers professional
      DSTV installations, upgrades and digital solutions — full site launching soon.
    </p>

    <div class="badge">
      <span class="dot"></span>
      Under Construction
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Digitech DSTV. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
